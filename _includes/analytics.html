{% if site.google_analytics %}
  <!-- Free visitor counter (CountAPI) -->
  <div id="visitor-counter" style="text-align:center; margin:1.5rem 0; font-size:0.95rem; color:#444;">
    <a href="https://countapi.xyz" target="_blank" rel="noopener noreferrer" style="color:inherit; text-decoration:none;">
      Visitor count: <span id="countapi-value">loading...</span>
    </a>
  </div>
  <script>
    (function() {
      var counterId = 'fasogbon-github-io';
      var counterKey = 'visitor-counter';
      var url = 'https://api.countapi.xyz/hit/' + counterId + '/' + counterKey;

      fetch(url)
        .then(function(response) {
          return response.json();
        })
        .then(function(data) {
          if (data && typeof data.value === 'number') {
            document.getElementById('countapi-value').textContent = data.value;
          } else {
            document.getElementById('countapi-value').textContent = 'N/A';
          }
        })
        .catch(function() {
          document.getElementById('countapi-value').textContent = 'N/A';
        });
    })();
  </script>
{% endif %}
